name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Knip
        run: npm run knip

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Browser smoke
        env:
          AUTH_SECRET: ci-browser-test-auth-secret-min-32-chars!!
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3010
          BACKENDLESS_CODE_URL: https://api.backendless.com/ci-test-app/ci-test-code
          BACKENDLESS_REST_URL: https://api.backendless.com/ci-test-app/ci-test-key
          EXTERNAL_WRITES_ENABLED: "false"
        run: npm run test:browser
